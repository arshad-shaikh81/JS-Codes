<!--3 Develop a simple arithmetic calculator using JavaScript operators and user-->
<!-- input.-->

<html>

<head>
    <title>Arithmetic Calculator</title>
</head>

<body>

<h2>Simple Arithmetic Calculator</h2>


<script>
    let num1 = Number(prompt("Enter first num:"));
    let num2 = Number(prompt("Enter second num:"));

    let addition = num1 + num2;
    let subtraction = num1 - num2;
    let multiplication = num1 * num2;
    let division = num1 / num2;

    document.write("<h3>Results:</h3>");

    document.write("Addition = " + addition + "<br>");
    document.write("Subtraction = " + subtraction + "<br>");
    document.write("Multiplication = " + multiplication + "<br>");
    document.write("Division = " + division + "<br>");
</script>

</body>

</html>
