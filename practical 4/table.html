<!--Practical No 4 : Generate multiplication tables using loops in JavaScript.-->
<!DOCTYPE html>
<html>

<head>
    <title>Multiplication Table</title>
</head>

<body>

<script>
    let num = Number(prompt("Enter a number:"));

    for (let i = 1; i <= 10; i++) {
        document.write(num + " x " + i + " = " + (num * i) + "<br>");
    }
</script>

</body>

</html>
