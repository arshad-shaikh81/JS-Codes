<!--Practical 6 : Perform various string operations in JavaScript such as finding the
 length of a string and converting the string into uppercase and lowercase.-->
<!DOCTYPE html>
<html>

<head>
    <title>String Operations</title>
</head>

<body>

<h2>String Operations</h2>

<div id="result"></div>

<script>
    let text = prompt("Enter a text:");

    let characters = text.length;

    let upper = text.toUpperCase();

    let lower = text.toLowerCase();

    document.getElementById("result").innerHTML =
        "Original Text: " + text + "<br>" +
        "Number of Characters: " + characters + "<br>" +
        "Uppercase: " + upper + "<br>" +
        "Lowercase: " + lower;
</script>

</body>

</html>
